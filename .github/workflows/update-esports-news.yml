name: Refresh MLBB esports news

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-mlbb-esports-news
  cancel-in-progress: true

jobs:
  refresh-news:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Install scraper dependencies
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4
      - name: Fetch official news
        run: python scripts/update_esports_news.py
      - name: Publish updated news data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/esports-news.json
          if git diff --cached --quiet; then
            echo "No news changes."
            exit 0
          fi
          git commit -m "Refresh MLBB esports news feed"
          git push
