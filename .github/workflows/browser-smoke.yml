name: Grim_gg browser interaction tests

on:
  workflow_run:
    workflows: ["pages build and deployment"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: grim-gg-browser-smoke
  cancel-in-progress: true

jobs:
  browser-smoke:
    name: Test live site interactions on mobile Chromium
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the deployed revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Run browser interaction tests against GitHub Pages
        run: node scripts/browser_smoke_test.mjs
