<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#09080c">
  <meta name="robots" content="noindex,follow">
  <link rel="icon" href="/Grim-gg-/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/Grim-gg-/styles.css?v=48">
  <title>Страница не найдена — Grim_gg</title>
  <style>
    *{box-sizing:border-box}
    body{min-height:100svh;margin:0;display:grid;place-items:center;padding:24px;background:radial-gradient(ellipse at 50% 25%,rgba(255,48,72,.12),transparent 45%),#09080c;color:#f7f2f7;font-family:Manrope,Arial,sans-serif}
    main{width:min(100%,620px);padding:clamp(24px,6vw,52px);border:1px solid rgba(255,83,103,.25);border-radius:14px;background:rgba(18,16,23,.9);text-align:center;box-shadow:0 24px 80px rgba(0,0,0,.35)}
    .mark{width:64px;height:64px;display:grid;place-items:center;margin:0 auto 26px;border:1px solid #ff3048;border-radius:12px 4px 12px 4px;font-size:30px;font-weight:900;box-shadow:0 0 32px rgba(255,48,72,.12)}
    .mark span,.accent{color:#ff5369}
    .eyebrow{color:#ff7888;font-size:11px;font-weight:800;letter-spacing:.18em}
    h1{margin:12px 0;font-size:clamp(32px,8vw,54px);line-height:1.1;letter-spacing:-.04em}
    p{max-width:42ch;margin:0 auto 26px;color:#b9adbc;line-height:1.8}
    nav{display:flex;flex-wrap:wrap;justify-content:center;gap:10px}
    a{min-height:44px;display:inline-flex;align-items:center;justify-content:center;padding:10px 15px;border:1px solid rgba(255,255,255,.13);border-radius:7px;color:#f7f2f7;text-decoration:none;font-size:13px;font-weight:800}
    a.primary{border-color:#ff3048;background:#ff3048;color:white}
    a:focus-visible{outline:2px solid #ff8191;outline-offset:3px}
    @media(prefers-reduced-motion:no-preference){a{transition:transform .18s,border-color .18s}a:hover{transform:translateY(-2px);border-color:#ff5369}}
  </style>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true">G<span>_</span></div>
    <div class="eyebrow">GRIM_GG / 404</div>
    <h1>Похоже, ты <span class="accent">сбился с пути.</span></h1>
    <p>Такой страницы здесь нет или ссылка устарела. Вернись в базу и продолжай готовиться к следующему матчу.</p>
    <nav aria-label="Навигация">
      <a class="primary" href="/Grim-gg-/?page=home">На главную ↗</a>
      <a href="/Grim-gg-/?page=heroes">Герои</a>
      <a href="/Grim-gg-/?page=items">Предметы</a>
      <a href="/Grim-gg-/?page=builds">Сборки</a>
    </nav>
  </main>
</body>
</html>
